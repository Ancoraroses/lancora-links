<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Àncora · Recetario</title>
<style>
  :root{
    --ink:#122A2E;
    --navy:#0E2126;
    --teal:#1F6F78;
    --teal-deep:#164F56;
    --sand:#F2ECDD;
    --sand-soft:#FBF8F1;
    --copper:#B5572E;
    --line: rgba(18,42,46,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .hero{
    background: var(--navy);
    color: var(--sand-soft);
    padding: 3.2rem 1.5rem 2.4rem;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(31,111,120,0.35), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(31,111,120,0.25), transparent 50%);
    pointer-events:none;
  }
  .hero h1{
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    letter-spacing: 0.02em;
    margin: 0;
    position:relative;
  }
  .hero p{
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: #C9D6D2;
    margin: 0.6rem 0 0;
    position:relative;
  }
  .rope{
    width:120px;
    height:2px;
    background: var(--teal);
    margin: 1.4rem auto 0;
    position:relative;
  }
  .rope::before, .rope::after{
    content:"";
    position:absolute;
    top:-3px;
    width:8px;height:8px;
    border-radius:50%;
    background: var(--teal);
  }
  .rope::before{ left:-14px; }
  .rope::after{ right:-14px; }

  .controls{
    position: sticky;
    top:0;
    z-index:10;
    background: var(--sand-soft);
    border-bottom: 1px solid var(--line);
    padding: 1rem 1.5rem;
  }
  .search-wrap{
    max-width: 640px;
    margin: 0 auto;
    position: relative;
  }
  #search{
    width:100%;
    padding: 0.85rem 1.1rem 0.85rem 2.6rem;
    font-size: 1.05rem;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  #search:focus{ border-color: var(--teal); }
  .search-icon{
    position:absolute;
    left:0.9rem;
    top:50%;
    transform:translateY(-50%);
    width:18px;height:18px;
    color: var(--teal-deep);
    pointer-events:none;
  }
  .chips{
    max-width: 640px;
    margin: 0.7rem auto 0;
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem;
    justify-content:center;
  }
  .chip{
    border:1px solid var(--line);
    background:#fff;
    color: var(--teal-deep);
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    font-size:0.82rem;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .chip:hover{ border-color: var(--teal); }
  .chip.active{
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
  }

  main{
    max-width: 1000px;
    margin: 0 auto;
    padding: 1.8rem 1.5rem 4rem;
  }
  #count{
    color:#5B6864;
    font-size:0.9rem;
    margin: 0 0.2rem 1rem;
  }
  .grid{
    display:flex;
    flex-wrap: wrap;
    gap: 1.1rem;
  }
  .card{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1.2rem 1.3rem 1.3rem;
    border-left: 3px solid var(--teal);
    flex: 1 1 270px;
    max-width: calc(33.333% - 0.74rem);
  }
  @media (max-width: 820px){
    .card{ max-width: calc(50% - 0.55rem); }
  }
  @media (max-width: 540px){
    .card{ max-width: 100%; }
  }
  .card h2{
    font-family: Georgia, serif;
    font-size: 1.25rem;
    margin: 0 0 0.15rem;
    color: var(--navy);
  }
  .card .cat{
    font-size: 0.72rem;
    color: var(--copper);
    margin: 0 0 0.7rem;
    letter-spacing: 0.03em;
  }
  .card ul{
    margin:0;
    padding-left: 1.1rem;
    font-size: 0.92rem;
    line-height: 1.55;
    color: #26302E;
  }
  .card .note{
    margin-top: 0.6rem;
    font-size: 0.82rem;
    font-style: italic;
    color: #6C6156;
  }
  .empty{
    text-align:center;
    padding: 3rem 1rem;
    color:#7A8480;
    font-family: Georgia, serif;
    font-style: italic;
    display:none;
  }
  mark{
    background: #FBE3B0;
    color: inherit;
    border-radius: 2px;
  }
  @media (max-width: 480px){
    .hero{ padding: 2.4rem 1.2rem 2rem; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>L'ÀNCORA</h1>
  <p>Recetario de cócteles de la casa</p>
  <div class="rope"></div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="search" placeholder="Busca por nombre o ingrediente (ej. lima, gin, cachaça)…" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</div>

<main>
  <p id="count"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Ningún cóctel coincide con esa búsqueda.</div>
</main>

<script>
const cocktails = [{"name":"Batida Coco","ingredients":["80 ml agua de coco","50 ml cachaça","20 ml puré de coco"],"notes":[],"category":"Ron / Cachaça"},{"name":"Batida Fresa","ingredients":["50 ml cachaça","10 ml lima","80 ml agua de coco","20 ml puré de fresa (o 4 fresas grandes trituradas si son dulces)"],"notes":[],"category":"Ron / Cachaça"},{"name":"Batida Plátano","ingredients":["50 ml cachaça","80 ml agua de coco","20 ml sirope de plátano","20 ml licor de café"],"notes":["A menos de media pala de hielo picado."],"category":"Ron / Cachaça"},{"name":"Batida Sandía","ingredients":["25 ml lima","20 ml puré de sandía (o sandía triturada)","50 ml cachaça","80 ml agua de coco"],"notes":[],"category":"Ron / Cachaça"},{"name":"Bloody Mary","ingredients":["50 ml vodka","20 ml zumo de limón","2 gotas de tabasco","1 pizca de pimienta y sal","90 ml zumo de tomate"],"notes":["Opcional: 1/2 cucharadita de mostaza."],"category":"Vodka"},{"name":"Carrot Meet","ingredients":["10 ml zumo de naranja","70 ml zumo de zanahoria","10 ml lima","10 ml sirope de agave","2 hielos + hielo picado arriba","Top de tónica 1724 (es lo último)"],"notes":[],"category":"Sin alcohol"},{"name":"Cosmopolitan","ingredients":["45 ml vodka","35 ml zumo de arándanos","15 ml cointreau","15 ml lima"],"notes":[],"category":"Vodka"},{"name":"Daiquiri","ingredients":["45 ml ron Zacapa","15 ml sirope de azúcar","25 ml lima","2 hielos + hielo picado arriba"],"notes":[],"category":"Ron / Cachaça"},{"name":"Gin Fizz","ingredients":["45 ml Tanqueray N.º 10","30 ml lima","15 ml azúcar líquida","2 hielos + hielo picado arriba","Top de soda"],"notes":["Opcional: puede ser con clara de huevo."],"category":"Gin"},{"name":"Gin Tonic Mare","ingredients":["50 ml Gin Mare","Tónica 1724 (aparte)","15 ml azúcar líquida","20 ml lima","Twist de limón","Romero (decoración)"],"notes":[],"category":"Gin"},{"name":"Golden Daiquiri","ingredients":["45 ml ron diplomático mantuano","15 ml azúcar líquida","25 ml lima"],"notes":[],"category":"Ron / Cachaça"},{"name":"Kiwi Meet","ingredients":["15 ml sirope de kiwi","30 ml puré de kiwi","1/2 kiwi machacado","10 ml lima","2 hielos + hielo picado arriba","Top de tónica 1724"],"notes":[],"category":"Sin alcohol"},{"name":"Kraken Stormy","ingredients":["10 ml lima","60 ml Kraken","1 botellita de ginger beer"],"notes":[],"category":"Ron / Cachaça"},{"name":"Margarita","ingredients":["15 ml lima","20 ml cointreau","45 ml tequila Don Julio blanco"],"notes":["Media copa con sal, media sin sal."],"category":"Tequila / Mezcal / Pisco"},{"name":"Mezcalita","ingredients":["15 ml azúcar líquida","25 ml lima","50 ml mezcal"],"notes":[],"category":"Tequila / Mezcal / Pisco"},{"name":"Negroni","ingredients":["30 ml Gin Mare","30 ml Campari","30 ml martini","Twist de limón","Twist de naranja"],"notes":[],"category":"Gin"},{"name":"New Fashioned","ingredients":["3 gotas de angostura","1 cucharada grande de azúcar","30 ml Zacapa + 30 ml más después","2 cubos de hielo","Twist de naranja","Top de soda","2 cerecitas (decoración)"],"notes":[],"category":"Ron / Cachaça"},{"name":"Old Fashioned","ingredients":["3 gotas de angostura","1 cucharada grande de azúcar","60 ml bourbon","2 cubos de hielo","Soda"],"notes":[],"category":"Whisky"},{"name":"Perfect Martini","ingredients":["60 ml Gin Mare","10 ml martini","2 gotas de solución salina"],"notes":[],"category":"Gin"},{"name":"Piña Colada","ingredients":["Piña natural","Crema de coco","20 ml lima","1 pizca de sal","60 ml ron blanco"],"notes":["Opcional: también puede hacerse mitad ron blanco, mitad Kraken."],"category":"Ron / Cachaça"},{"name":"Pineapple Meets","ingredients":["30 ml mango","10 ml granadina","2 hielos + hielo picado arriba","70 ml zumo de piña","20 ml lima","Top de tónica 1724"],"notes":[],"category":"Sin alcohol"},{"name":"Pisco Sour","ingredients":["30 ml lima","20 ml azúcar líquida","50 ml pisco"],"notes":[],"category":"Tequila / Mezcal / Pisco"},{"name":"Skinny Stormy","ingredients":["Tónica 1724","Hielo","Enebro (3-5 bolitas)","Twist de limón"],"notes":[],"category":"Sin alcohol"},{"name":"Tiki-Tri","ingredients":["30 ml Kraken","30 ml cachaça","30 ml puré de plátano","25 ml lima","15 ml jengibre","3 cubos + hielo picado arriba"],"notes":[],"category":"Ron / Cachaça"},{"name":"Triple Orange","ingredients":["50 ml Gin Mare","1 cucharada de mermelada de naranja","Tónica 1724","Twist de naranja"],"notes":[],"category":"Gin"},{"name":"Whisky Sour","ingredients":["30 ml lima","50 ml whisky bourbon","15 ml azúcar líquida","15 ml clara de huevo"],"notes":[],"category":"Whisky"}];

const chipList = ["Todos","Gin","Ron / Cachaça","Vodka","Whisky","Tequila / Mezcal / Pisco","Sin alcohol"];
let activeChip = "Todos";
let query = "";

const chipsEl = document.getElementById("chips");
chipList.forEach(c=>{
  const b = document.createElement("button");
  b.className = "chip" + (c==="Todos" ? " active" : "");
  b.textContent = c;
  b.addEventListener("click", ()=>{
    activeChip = c;
    document.querySelectorAll(".chip").forEach(el=>el.classList.remove("active"));
    b.classList.add("active");
    render();
  });
  chipsEl.appendChild(b);
});

function highlight(text, q){
  if(!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0,idx) + "<mark>" + text.slice(idx, idx+q.length) + "</mark>" + text.slice(idx+q.length);
}

function matches(c){
  const catOk = activeChip === "Todos" || c.category === activeChip;
  if(!catOk) return false;
  if(!query) return true;
  const q = query.toLowerCase();
  if(c.name.toLowerCase().includes(q)) return true;
  return c.ingredients.some(i => i.toLowerCase().includes(q));
}

function render(){
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  const filtered = cocktails.filter(matches);
  grid.innerHTML = "";
  count.textContent = filtered.length + (filtered.length===1 ? " cóctel" : " cócteles");
  empty.style.display = filtered.length ? "none" : "block";
  filtered.forEach(c=>{
    const card = document.createElement("div");
    card.className = "card";
    const ingHtml = c.ingredients.map(i=>"<li>"+highlight(i, query)+"</li>").join("");
    const noteHtml = c.notes.map(n=>'<div class="note">'+n+'</div>').join("");
    card.innerHTML =
      "<h2>"+highlight(c.name, query)+"</h2>"+
      '<div class="cat">'+c.category.toUpperCase()+"</div>"+
      "<ul>"+ingHtml+"</ul>"+
      noteHtml;
    grid.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input", (e)=>{
  query = e.target.value;
  render();
});

render();
</script>

</body>
</html>
