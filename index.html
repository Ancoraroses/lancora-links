<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Àncora · Enllaços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Mismo lenguaje visual que la página de agradecimiento (/gracias/):
   arena + azul marino #1A2B45 + dorado #C5A059, Cormorant + Jost, una columna tranquila. */
:root{color-scheme:light dark;
--bg:light-dark(#F4EDE1,#0E1724);--ink:light-dark(#1A2B45,#EDE5D6);--soft:light-dark(#5B6577,#A9B1BF);
--navy:#1A2B45;--gold:#C5A059;--card:light-dark(#FFFDF8,#162236);--line:light-dark(#E3D8C4,#2A3850)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Jost,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:480px;margin:0 auto;padding:28px 22px 24px}
h1,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;letter-spacing:.02em}
.brand svg{width:26px;height:26px;color:var(--gold)}
.lang{display:flex;flex-wrap:wrap;gap:0}
.lang button{font:inherit;font-size:13px;background:none;border:0;color:var(--soft);padding:10px 6px;min-height:44px;cursor:pointer;border-radius:8px}
.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1{font-size:clamp(34px,9vw,44px);line-height:1.05;margin:30px 0 8px;text-wrap:balance}
.lead{color:var(--soft);margin:0 0 24px}

/* Tarjeta destacada: Club Àncora */
.ticket{position:relative;display:block;text-decoration:none;background:var(--navy);color:#F4EDE1;border-radius:18px;padding:24px 24px 22px;box-shadow:0 18px 40px -22px rgba(26,43,69,.7);overflow:hidden}
.ticket::before{content:"";position:absolute;inset:8px;border:1px solid rgba(197,160,89,.55);border-radius:12px;pointer-events:none}
.ticket .notch{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket .l{left:-11px}.ticket .r{right:-11px}
.ticket .waves{position:absolute;right:-10px;bottom:-6px;width:170px;opacity:.16;color:var(--gold)}
.ticket .kick{font-size:14px;color:var(--gold);margin:0}
.ticket .big{font-family:"Cormorant Garamond",serif;font-size:38px;line-height:1.05;margin:6px 0 16px}
.ticket .go{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);border-radius:999px;padding:9px 18px;font-size:15px;background:var(--gold);color:#1A2B45;font-weight:500}
.ticket .go svg{width:16px;height:16px}

/* Lista de enlaces */
.links{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px;text-decoration:none;cursor:pointer;transition:border-color .2s,transform .2s}
.row:hover{border-color:var(--gold);transform:translateY(-1px)}
.row .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center}
.row .ic svg{width:20px;height:20px;color:var(--gold)}
.row .txt{display:flex;flex-direction:column;line-height:1.3}
.row .name{font-size:16px;font-weight:500}
.row .desc{font-size:13.5px;color:var(--soft)}
.row .arr{margin-left:auto;flex:none;width:16px;height:16px;color:var(--gold)}

.social{display:flex;justify-content:center;gap:28px;margin-top:26px}
.round{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;font-size:13px;color:var(--soft)}
.round svg{width:56px;height:56px;padding:15px;border-radius:50%;background:var(--navy);color:var(--gold);transition:transform .2s}
.round:hover svg{transform:translateY(-2px)}
footer{margin-top:34px;text-align:center;font-size:13px;color:var(--soft);padding-bottom:8px}
footer .serif{font-size:18px;color:var(--ink)}
footer .legal{margin-top:12px}
footer .legal a{display:inline-block;padding:10px 4px}

/* WiFi */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,20,33,.55);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{position:relative;background:var(--bg);color:var(--ink);border-radius:18px;max-width:340px;width:100%;padding:26px 22px 22px;text-align:center;border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:rise .3s ease}
.modal .x{position:absolute;top:6px;right:6px;width:44px;height:44px;border:0;background:none;color:var(--soft);cursor:pointer;font-size:22px;line-height:1}
.modal h3{font-size:28px;margin:4px 0 2px}
.modal .sub{font-size:14px;color:var(--soft);margin:0 0 16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;text-align:left}
.field .lab{font-size:12px;color:var(--gold)}
.field .val{font-size:16px;word-break:break-all}
.copy{flex:none;font:inherit;font-size:13px;border:1px solid var(--gold);background:none;color:var(--ink);border-radius:999px;padding:8px 12px;min-height:40px;cursor:pointer}
.qr{margin:14px auto 4px;width:150px;height:150px;border-radius:10px;background:#fff;padding:8px;border:1px solid var(--line)}
.qr img{width:100%;height:100%;display:block}
.hint{font-size:12.5px;color:var(--soft);margin-top:8px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}.row{transition:none}}
.brand .brand-logo{height:44px;width:auto;display:block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-anchor" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="5.5" r="2.6"/><path d="M16 8.2V28M10 12.5h12M5 19c0 5 5 9 11 9s11-4 11-9M5 19l-2 2.5M5 19l2.6 1.4M27 19l2 2.5M27 19l-2.6 1.4"/></g></symbol>
  <symbol id="ic-wave" viewBox="0 0 40 20"><path d="M2 12c4-6 8-6 12 0s8 6 12 0 8-6 12 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></symbol>
  <symbol id="ic-cocktail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16L12 13v7"/><path d="M8 21h8"/><path d="M6 4c2 3 4 4 6 4s4-1 6-4"/></symbol>
  <symbol id="ic-wine" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10l-.5 6a4.5 4.5 0 01-9 0z"/><path d="M12 12.5V21M8 21h8"/><path d="M7.3 6h9.4"/></symbol>
  <symbol id="ic-club" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M12 6.2l.9 1.8 2 .3-1.45 1.4.35 2L12 10.8l-1.8.9.35-2L9.1 8.3l2-.3z"/><path d="M8.5 14l-1.5 7 5-2.5 5 2.5-1.5-7"/></symbol>
  <symbol id="ic-review" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3h11A2.5 2.5 0 0120 5.5v8A2.5 2.5 0 0117.5 16H10l-4.5 4v-4H6.5A2.5 2.5 0 014 13.5v-8z"/><path d="M12 6.6l1.05 2.15 2.35.35-1.7 1.68.4 2.37L12 12.05l-2.1 1.1.4-2.37-1.7-1.68 2.35-.35z"/></symbol>
  <symbol id="ic-whatsapp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 10-3.7 7L21 20l-1.1-3.7c.4-.7.6-1.5.6-2.3z"/></symbol>
  <symbol id="ic-instagram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-briefcase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M2.5 12.5h19"/></symbol>
  <symbol id="ic-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></symbol>
  <symbol id="ic-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5c5.5-5.3 14.5-5.3 20 0"/><path d="M5.5 12.3c3.7-3.5 9.3-3.5 13 0"/><path d="M9 16c1.7-1.6 4.3-1.6 6 0"/><circle cx="12" cy="19.3" r="1.1" fill="currentColor" stroke="none"/></symbol>
</svg>

<div class="wrap">
  <header>
    <div class="brand"><img class="brand-logo" src="https://raw.githubusercontent.com/Ancoraroses/lancora-media/main/brand/logo-horizontal.png" alt="L'Àncora Bar Restaurant" height="44"></div>
    <nav class="lang" id="lang" aria-label="Idioma"></nav>
  </header>

  <h1 id="tagline">Tot el que t'oferim</h1>
  <p class="lead" id="lead">Bar · Restaurant · Roses, des de 1986</p>

  <a class="ticket" id="book" href="https://ancoraroses.github.io/lancora-links/club-ancora/">
    <span class="notch l"></span><span class="notch r"></span>
    <svg class="waves" viewBox="0 0 170 60" aria-hidden="true"><use href="#ic-wave" x="0" y="0" width="80" height="40"/><use href="#ic-wave" x="60" y="14" width="80" height="40"/><use href="#ic-wave" x="20" y="28" width="80" height="40"/><use href="#ic-wave" x="95" y="34" width="80" height="40"/></svg>
    <p class="kick" id="bookKick"></p>
    <div class="big" id="bookBig"></div>
    <span class="go"><span id="bookGo"></span><svg><use href="#ic-arrow"/></svg></span>
  </a>

  <div class="links" id="links"></div>

  <div class="social">
    <a class="round" href="https://wa.me/34972256386" target="_blank" rel="noopener" aria-label="WhatsApp"><svg><use href="#ic-whatsapp"/></svg><span>WhatsApp</span></a>
    <a class="round" href="https://instagram.com/ancoraroses" target="_blank" rel="noopener" aria-label="Instagram @ancoraroses"><svg><use href="#ic-instagram"/></svg><span>Instagram</span></a>
  </div>

  <footer>
    <div class="serif" id="foot"></div>
    <div>Avinguda de Rhode 62 · 17480 Roses</div>
    <div class="legal">
      <a href="https://www.ancoraroses.com/avis-legal/">Avís legal</a> ·
      <a href="https://www.ancoraroses.com/privacitat/">Privacitat</a> ·
      <a href="https://www.ancoraroses.com/cookies/">Cookies</a>
    </div>
  </footer>
</div>

<div class="overlay" id="wifiOverlay" role="dialog" aria-modal="true" aria-labelledby="wifiTitle">
  <div class="modal">
    <button class="x" id="wifiClose" type="button" aria-label="Tancar">×</button>
    <h3 id="wifiTitle"></h3>
    <p class="sub" id="wifiSub"></p>
    <div class="field"><div><div class="lab" id="wifiNet"></div><div class="val" id="wifiSsid"></div></div><button class="copy" type="button" data-copy="ssid"></button></div>
    <div class="field"><div><div class="lab" id="wifiPassL"></div><div class="val" id="wifiPass"></div></div><button class="copy" type="button" data-copy="pass"></button></div>
    <div class="qr"><img id="wifiQr" alt="QR WiFi"></div>
    <div class="hint" id="wifiHint"></div>
  </div>
</div>

<script>
{
/* ============================================================
   ✏️  EDITA AQUÍ LOS ENLACES (título y descripción por idioma)
   ============================================================ */
const LINKS = [
  { icon:"book", url:"https://ancoraroses.github.io/lancora-carta-comida/lancora-carta-comida.html",
    title:{ca:"Carta de menjar",es:"Carta de comida",en:"Food menu",fr:"Carte des plats",de:"Speisekarte",nl:"Menukaart"},
    desc:{ca:"Descobreix els nostres plats",es:"Descubre nuestros platos",en:"Discover our dishes",fr:"Découvrez nos plats",de:"Entdecke unsere Gerichte",nl:"Ontdek onze gerechten"} },
  { icon:"cocktail", url:"https://ancoraroses.github.io/lancora-carta-bebidas/lancora-carta-bebidas.html",
    title:{ca:"Carta de begudes",es:"Carta de bebidas",en:"Drinks menu",fr:"Carte des boissons",de:"Getränkekarte",nl:"Drankenkaart"},
    desc:{ca:"Vins, còctels i més",es:"Vinos, cócteles y más",en:"Wines, cocktails and more",fr:"Vins, cocktails et plus",de:"Weine, Cocktails und mehr",nl:"Wijnen, cocktails en meer"} },
  { icon:"wine", url:"https://ancoraroses.github.io/lancora-carta-bebidas/lancora-carta-vins.html",
    title:{ca:"Carta de vins",es:"Carta de vinos",en:"Wine list",fr:"Carte des vins",de:"Weinkarte",nl:"Wijnkaart"},
    desc:{ca:"Selecció del sommelier, amb maridatges",es:"Selección del sumiller, con maridajes",en:"Sommelier's selection, with pairings",fr:"Sélection du sommelier, avec accords",de:"Auswahl des Sommeliers, mit Speiseempfehlungen",nl:"Selectie van de sommelier, met spijssuggesties"} },
  { icon:"calendar", url:"https://cloudclient28.hiopos.com/booking/#/details",
    title:{ca:"Reserva la teva taula",es:"Reserva tu mesa",en:"Book your table",fr:"Réservez votre table",de:"Reserviere deinen Tisch",nl:"Reserveer je tafel"},
    desc:{ca:"Per a la propera visita",es:"Para tu próxima visita",en:"For your next visit",fr:"Pour votre prochaine visite",de:"Für deinen nächsten Besuch",nl:"Voor je volgende bezoek"} },
  { icon:"review", url:"https://ancoraroses.github.io/lancora-links/ressenyes/",
    title:{ca:"Deixa'ns una ressenya",es:"Déjanos una reseña",en:"Leave us a review",fr:"Laissez-nous un avis",de:"Bewerte uns",nl:"Laat een recensie achter"},
    desc:{ca:"La teva opinió ens importa",es:"Tu opinión nos importa",en:"Your opinion matters",fr:"Votre avis compte",de:"Deine Meinung zählt",nl:"Jouw mening telt"} }
];

/* ✏️  DATOS DEL WIFI */
const WIFI = { ssid:"LAncora_WiFi", password:"AncoraRoses2026" };

const UI = {
  tagline:{ca:"Tot el que t'oferim",es:"Todo lo que te ofrecemos",en:"Everything we offer",fr:"Tout ce que nous offrons",de:"Alles, was wir bieten",nl:"Alles wat wij bieden"},
  lead:{ca:"Bar · Restaurant · Roses, des de 1986",es:"Bar · Restaurante · Roses, desde 1986",en:"Bar · Restaurant · Roses, since 1986",fr:"Bar · Restaurant · Roses, depuis 1986",de:"Bar · Restaurant · Roses, seit 1986",nl:"Bar · Restaurant · Roses, sinds 1986"},
  bookKick:{ca:"Club Àncora · 5 segells, una copa de regal",es:"Club Àncora · 5 sellos, una copa de regalo",en:"Club Àncora · 5 stamps, a free glass",fr:"Club Àncora · 5 tampons, un verre offert",de:"Club Àncora · 5 Stempel, ein Glas gratis",nl:"Club Àncora · 5 stempels, een gratis glas"},
  bookBig:{ca:"Fes-te soci del Club",es:"Hazte socio del Club",en:"Join the Club",fr:"Rejoignez le Club",de:"Werde Clubmitglied",nl:"Word lid van de Club"},
  bookGo:{ca:"Entrar al Club",es:"Entrar al Club",en:"Enter the Club",fr:"Entrer au Club",de:"Zum Club",nl:"Naar de Club"},
  foot:{ca:"Des de 1986, vora el mar",es:"Desde 1986, frente al mar",en:"Since 1986, by the sea",fr:"Depuis 1986, face à la mer",de:"Seit 1986, am Meer",nl:"Sinds 1986, aan zee"},
  wifiT:{ca:"WiFi per a clients",es:"WiFi para clientes",en:"Guest WiFi",fr:"WiFi pour les clients",de:"Gäste-WLAN",nl:"WiFi voor gasten"},
  wifiD:{ca:"Connecta't gratis al local",es:"Conéctate gratis en el local",en:"Free connection in-house",fr:"Connexion gratuite sur place",de:"Kostenlos vor Ort verbinden",nl:"Gratis verbinding ter plaatse"},
  wifiSub:{ca:"Connecta't gratis durant la teva visita",es:"Conéctate gratis durante tu visita",en:"Connect for free during your visit",fr:"Connectez-vous gratuitement pendant votre visite",de:"Verbinde dich während deines Besuchs kostenlos",nl:"Maak gratis verbinding tijdens je bezoek"},
  net:{ca:"Xarxa",es:"Red",en:"Network",fr:"Réseau",de:"Netzwerk",nl:"Netwerk"},
  pass:{ca:"Contrasenya",es:"Contraseña",en:"Password",fr:"Mot de passe",de:"Passwort",nl:"Wachtwoord"},
  copy:{ca:"Copiar",es:"Copiar",en:"Copy",fr:"Copier",de:"Kopieren",nl:"Kopiëren"},
  copied:{ca:"Copiat",es:"Copiado",en:"Copied",fr:"Copié",de:"Kopiert",nl:"Gekopieerd"},
  hint:{ca:"Escaneja amb la càmera per connectar-te automàticament",es:"Escanea con la cámara para conectarte automáticamente",en:"Scan with your camera to connect automatically",fr:"Scannez avec l'appareil photo pour vous connecter automatiquement",de:"Mit der Kamera scannen, um dich automatisch zu verbinden",nl:"Scan met je camera om automatisch te verbinden"}
};

const LANGS=["ca","es","en","fr","de","nl"];
const $=id=>document.getElementById(id);
let L=(()=>{for(const l of (navigator.languages||[navigator.language||"ca"])){const c=(l||"").slice(0,2).toLowerCase();if(LANGS.includes(c))return c}return "ca"})();
const t=f=>f[L]||f.ca;

function render(){
  document.documentElement.lang=L;
  $("lang").innerHTML=LANGS.map(l=>`<button type="button" data-l="${l}" aria-pressed="${l===L}">${l.toUpperCase()}</button>`).join("");
  $("lang").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;render()}));
  $("tagline").textContent=t(UI.tagline);
  $("lead").textContent=t(UI.lead);
  $("bookKick").textContent=t(UI.bookKick);
  $("bookBig").textContent=t(UI.bookBig);
  $("bookGo").textContent=t(UI.bookGo);
  $("foot").textContent=t(UI.foot);
  const row=(ic,name,desc)=>`<span class="ic"><svg><use href="#ic-${ic}"/></svg></span><span class="txt"><span class="name">${name}</span><span class="desc">${desc}</span></span><svg class="arr"><use href="#ic-arrow"/></svg>`;
  $("links").innerHTML=LINKS.map(k=>`<a class="row" href="${k.url}" target="_blank" rel="noopener">${row(k.icon,t(k.title),t(k.desc))}</a>`).join("")
    +`<button type="button" class="row" id="wifiOpen">${row("wifi",t(UI.wifiT),t(UI.wifiD))}</button>`;
  $("wifiOpen").addEventListener("click",()=>{$("wifiOverlay").classList.add("open");$("wifiClose").focus()});
  $("wifiTitle").textContent=t(UI.wifiT);
  $("wifiSub").textContent=t(UI.wifiSub);
  $("wifiNet").textContent=t(UI.net);
  $("wifiPassL").textContent=t(UI.pass);
  $("wifiHint").textContent=t(UI.hint);
  document.querySelectorAll(".copy").forEach(b=>b.textContent=t(UI.copy));
}

$("wifiSsid").textContent=WIFI.ssid;
$("wifiPass").textContent=WIFI.password;
$("wifiQr").src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=0&data="+encodeURIComponent(`WIFI:T:WPA;S:${WIFI.ssid};P:${WIFI.password};H:false;;`);
const close=()=>$("wifiOverlay").classList.remove("open");
$("wifiClose").addEventListener("click",close);
$("wifiOverlay").addEventListener("click",e=>{if(e.target.id==="wifiOverlay")close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.querySelectorAll(".copy").forEach(b=>b.addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(b.dataset.copy==="ssid"?WIFI.ssid:WIFI.password)}catch(e){}
  b.textContent=t(UI.copied);setTimeout(()=>{b.textContent=t(UI.copy)},1500);
}));
render();
}
</script>
</body>
</html>
