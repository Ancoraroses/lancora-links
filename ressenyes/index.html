<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Àncora · La teva opinió</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Mismo lenguaje visual que /gracias/ y la página de enlaces: arena, azul marino #1A2B45, dorado #C5A059. */
:root{color-scheme:light dark;
--bg:light-dark(#F4EDE1,#0E1724);--ink:light-dark(#1A2B45,#EDE5D6);--soft:light-dark(#5B6577,#A9B1BF);
--navy:#1A2B45;--gold:#C5A059;--card:light-dark(#FFFDF8,#162236);--line:light-dark(#E3D8C4,#2A3850);--empty:light-dark(#DCCFB6,#34435C)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Jost,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:460px;margin:0 auto;padding:28px 22px 32px}
h1,h2,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;letter-spacing:.02em;text-decoration:none}
.brand svg{width:26px;height:26px;color:var(--gold)}
.lang{display:flex;flex-wrap:wrap}
.lang button{font:inherit;font-size:13px;background:none;border:0;color:var(--soft);padding:10px 6px;min-height:44px;cursor:pointer;border-radius:8px}
.lang button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1{font-size:clamp(34px,9vw,44px);line-height:1.05;margin:34px 0 10px;text-wrap:balance}
.lead{color:var(--soft);margin:0 0 26px}
.stars{display:flex;justify-content:space-between;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px}
.stars button{flex:1;background:none;border:0;padding:6px 0;min-height:56px;cursor:pointer;color:var(--empty);transition:transform .15s,color .15s}
.stars button svg{width:100%;max-width:46px;height:46px;fill:currentColor}
.stars button.lit{color:var(--gold)}
.stars button:hover{transform:scale(1.08)}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin:8px 4px 0}
.panel{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;animation:rise .35s ease}
.panel h2{font-size:30px;line-height:1.1;margin:0 0 6px}
.panel p{margin:0 0 16px;color:var(--soft)}
.btn{font:inherit;font-size:15px;width:100%;border-radius:999px;min-height:48px;padding:12px 18px;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.solid{background:var(--gold);color:#1A2B45;font-weight:500}
.btn + .btn{margin-top:10px}
.btn:disabled{opacity:.55;cursor:default}
label{display:block;font-size:14px;color:var(--soft);margin:14px 0 6px}
textarea,input{width:100%;font:16px/1.5 Jost,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:120px;resize:vertical}
.privacy{font-size:12.5px;color:var(--soft);margin:10px 0 0!important}
.done{text-align:center}
.done .mark{width:56px;height:56px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin:4px auto 12px}
.done .mark svg{width:26px;height:26px;color:var(--gold)}
footer{margin-top:40px;text-align:center;font-size:13px;color:var(--soft)}
footer .serif{font-size:17px;color:var(--ink)}
footer .legal a{display:inline-block;padding:10px 4px}
[hidden]{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}.stars button{transition:none}}
.brand .brand-logo{height:44px;width:auto;display:block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="anchor" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="16" cy="5.5" r="2.6"/><path d="M16 8.2V28M10 12.5h12M5 19c0 5 5 9 11 9s11-4 11-9M5 19l-2 2.5M5 19l2.6 1.4M27 19l2 2.5M27 19l-2.6 1.4"/></g></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.6 1-4.8 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.5 9.4l6.6-1z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="wrap">
  <header>
    <a class="brand" href="https://ancoraroses.github.io/lancora-links/"><img class="brand-logo" src="https://raw.githubusercontent.com/Ancoraroses/lancora-media/main/brand/logo-horizontal.png" alt="L'Àncora Bar Restaurant" height="44"></a>
    <nav class="lang" id="lang" aria-label="Idioma"></nav>
  </header>

  <section id="sRate">
    <h1 data-t="title"></h1>
    <p class="lead" data-t="sub"></p>
    <div class="stars" id="stars" role="group" aria-labelledby="sRate"></div>
    <div class="scale"><span data-t="low"></span><span data-t="high"></span></div>
  </section>

  <section class="panel" id="sChoice" hidden>
    <h2 data-t="chTitle"></h2>
    <p data-t="chSub"></p>
    <a class="btn solid" id="gBtn" data-t="google"></a>
    <button class="btn" type="button" id="pBtn" data-t="private"></button>
  </section>

  <section class="panel" id="sForm" hidden>
    <h2 data-t="cfTitle"></h2>
    <p data-t="cfSub"></p>
    <form id="form">
      <label for="msg" data-t="cfMsg"></label>
      <textarea id="msg"></textarea>
      <label for="name" data-t="cfName"></label>
      <input id="name" type="text" autocomplete="given-name">
      <label for="email" data-t="cfEmail"></label>
      <input id="email" type="email" autocomplete="email" inputmode="email">
      <button class="btn solid" type="submit" id="send" data-t="cfSend" style="margin-top:16px"></button>
      <p class="privacy"><span data-t="priv"></span> <a href="https://www.ancoraroses.com/privacitat/" data-t="privLink"></a>.</p>
    </form>
  </section>

  <section class="panel done" id="sDone" hidden>
    <div class="mark"><svg><use href="#check"/></svg></div>
    <h2 data-t="snTitle"></h2>
    <p data-t="snBody"></p>
    <a class="btn" id="gBtn2" data-t="google2"></a>
  </section>

  <footer>
    <div class="serif" data-t="foot"></div>
    <div>Avinguda de Rhode 62 · 17480 Roses</div>
    <div class="legal">
      <a href="https://www.ancoraroses.com/avis-legal/">Avís legal</a> ·
      <a href="https://www.ancoraroses.com/privacitat/">Privacitat</a> ·
      <a href="https://www.ancoraroses.com/cookies/">Cookies</a>
    </div>
  </footer>
</div>
<script>
{
const LOG_URL="https://script.google.com/macros/s/AKfycbw-HEGd93z5tdMFDt6OjG9OwaK4ls94JwOtobNvLj7C5lvdq4rPAE9vQNzHaDjeXmZgDg/exec";
const GOOGLE_REVIEW_URL="https://search.google.com/local/writereview?placeid=ChIJSbdRqrNmuhIRtQceE5BbHZw";
const T={
ca:{title:"Com ha anat la teva visita?",sub:"La teva opinió ens ajuda a millorar cada dia.",low:"Millorable",high:"Excel·lent",chTitle:"Gràcies",chSub:"On prefereixes deixar la teva opinió?",google:"Escriure una ressenya a Google",private:"Escriure al restaurant en privat",cfTitle:"Explica'ns-ho",cfSub:"El teu missatge arriba directament al nostre equip. El llegirem avui mateix.",cfMsg:"El teu comentari",cfName:"Nom (opcional)",cfEmail:"Correu (opcional, per respondre't)",cfSend:"Enviar missatge",cfSending:"Enviant…",priv:"Farem servir el teu missatge només per atendre't. Més informació a la nostra",privLink:"política de privacitat",snTitle:"Missatge rebut",snBody:"Gràcies per dir-nos-ho. El nostre equip ho llegirà avui.",google2:"També pots deixar una ressenya a Google",foot:"Des de 1986, vora el mar",stars:"estrelles"},
es:{title:"¿Cómo ha ido tu visita?",sub:"Tu opinión nos ayuda a mejorar cada día.",low:"Mejorable",high:"Excelente",chTitle:"Gracias",chSub:"¿Dónde prefieres dejar tu opinión?",google:"Escribir una reseña en Google",private:"Escribir al restaurante en privado",cfTitle:"Cuéntanoslo",cfSub:"Tu mensaje llega directamente a nuestro equipo. Lo leeremos hoy mismo.",cfMsg:"Tu comentario",cfName:"Nombre (opcional)",cfEmail:"Email (opcional, para responderte)",cfSend:"Enviar mensaje",cfSending:"Enviando…",priv:"Usaremos tu mensaje solo para atenderte. Más información en nuestra",privLink:"política de privacidad",snTitle:"Mensaje recibido",snBody:"Gracias por contárnoslo. Nuestro equipo lo leerá hoy.",google2:"También puedes dejar una reseña en Google",foot:"Desde 1986, frente al mar",stars:"estrellas"},
fr:{title:"Comment s'est passée votre visite ?",sub:"Votre avis nous aide à progresser chaque jour.",low:"À améliorer",high:"Excellente",chTitle:"Merci",chSub:"Où préférez-vous laisser votre avis ?",google:"Laisser un avis sur Google",private:"Écrire au restaurant en privé",cfTitle:"Dites-le-nous",cfSub:"Votre message arrive directement à notre équipe. Nous le lirons aujourd'hui.",cfMsg:"Votre commentaire",cfName:"Nom (facultatif)",cfEmail:"E-mail (facultatif, pour vous répondre)",cfSend:"Envoyer le message",cfSending:"Envoi…",priv:"Nous utiliserons votre message uniquement pour vous répondre. Plus d'informations dans notre",privLink:"politique de confidentialité",snTitle:"Message reçu",snBody:"Merci de nous l'avoir dit. Notre équipe le lira aujourd'hui.",google2:"Vous pouvez aussi laisser un avis sur Google",foot:"Depuis 1986, face à la mer",stars:"étoiles"},
en:{title:"How was your visit?",sub:"Your feedback helps us improve every day.",low:"Could be better",high:"Excellent",chTitle:"Thank you",chSub:"Where would you like to leave your feedback?",google:"Write a Google review",private:"Write to the restaurant privately",cfTitle:"Tell us about it",cfSub:"Your message goes straight to our team. We'll read it today.",cfMsg:"Your comment",cfName:"Name (optional)",cfEmail:"Email (optional, so we can reply)",cfSend:"Send message",cfSending:"Sending…",priv:"We'll only use your message to reply to you. More in our",privLink:"privacy policy",snTitle:"Message received",snBody:"Thank you for telling us. Our team will read it today.",google2:"You can also leave a Google review",foot:"Since 1986, by the sea",stars:"stars"},
nl:{title:"Hoe was uw bezoek?",sub:"Uw mening helpt ons elke dag beter te worden.",low:"Kan beter",high:"Uitstekend",chTitle:"Bedankt",chSub:"Waar wilt u uw mening achterlaten?",google:"Beoordeling schrijven op Google",private:"Privé schrijven naar het restaurant",cfTitle:"Vertel het ons",cfSub:"Uw bericht gaat rechtstreeks naar ons team. We lezen het vandaag nog.",cfMsg:"Uw opmerking",cfName:"Naam (optioneel)",cfEmail:"E-mail (optioneel, om te reageren)",cfSend:"Bericht versturen",cfSending:"Versturen…",priv:"We gebruiken uw bericht alleen om u te antwoorden. Meer in ons",privLink:"privacybeleid",snTitle:"Bericht ontvangen",snBody:"Bedankt dat u het ons vertelt. Ons team leest het vandaag.",google2:"U kunt ook een beoordeling achterlaten op Google",foot:"Sinds 1986, aan zee",stars:"sterren"}};
const LANGS=["ca","es","fr","en","nl"];
const $=id=>document.getElementById(id);
let L=(()=>{for(const l of (navigator.languages||[navigator.language||"es"])){const c=(l||"").slice(0,2).toLowerCase();if(LANGS.includes(c))return c}return "es"})();
let starVal=0,locked=false;
$("gBtn").href=GOOGLE_REVIEW_URL;$("gBtn2").href=GOOGLE_REVIEW_URL;

$("stars").innerHTML=[1,2,3,4,5].map(v=>`<button type="button" data-v="${v}"><svg viewBox="0 0 24 24"><use href="#star"/></svg></button>`).join("");
const btns=[...$("stars").querySelectorAll("button")];
const paint=n=>btns.forEach(b=>b.classList.toggle("lit",+b.dataset.v<=n));

function render(){
  const t=T[L];document.documentElement.lang=L;
  $("lang").innerHTML=LANGS.map(l=>`<button type="button" data-l="${l}" aria-pressed="${l===L}">${l.toUpperCase()}</button>`).join("");
  $("lang").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;render()}));
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t[e.dataset.t]});
  btns.forEach(b=>b.setAttribute("aria-label",b.dataset.v+" "+t.stars));
}

btns.forEach(b=>{
  b.addEventListener("mouseenter",()=>{if(!locked)paint(+b.dataset.v)});
  b.addEventListener("mouseleave",()=>{if(!locked)paint(starVal)});
  b.addEventListener("click",()=>{
    starVal=+b.dataset.v;paint(starVal);
    if(!locked){try{new Image().src=LOG_URL+"?action=log&waiter=&stars="+starVal+"&lang="+L+"&_="+Date.now()}catch(e){}}
    locked=true;
    $("sChoice").hidden=false;$("sForm").hidden=true;$("sDone").hidden=true;
    $("sChoice").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"nearest"});
  });
});
$("pBtn").addEventListener("click",()=>{$("sChoice").hidden=true;$("sForm").hidden=false;$("msg").focus()});

function jsonp(url,cb){const id="cb"+Date.now();window[id]=d=>{cb(d);delete window[id];const el=$("s_"+id);if(el)el.remove()};const s=document.createElement("script");s.id="s_"+id;s.src=url+"&callback="+id;document.head.appendChild(s)}
let sent=false;
function done(){if(sent)return;sent=true;$("sForm").hidden=true;$("sDone").hidden=false}
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const msg=$("msg").value.trim(),name=$("name").value.trim(),email=$("email").value.trim();
  $("send").disabled=true;$("send").textContent=T[L].cfSending;
  const url=LOG_URL+"?action=mail&waiter=&stars="+starVal+"&lang="+L
    +"&message="+encodeURIComponent(msg||"(sense comentari)")
    +"&name="+encodeURIComponent(name||"Anònim")
    +"&email="+encodeURIComponent(email||"no facilitat")+"&_="+Date.now();
  jsonp(url,done);
  setTimeout(done,4000);
});
render();
}
</script>
</body>
</html>
