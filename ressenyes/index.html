<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Àncora · La teva opinió</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b3c5d;--navy-dark:#082a41;--gold:#c89b3c;
    --gold-light:#e4c477;--sand:#f7f1e3;--sea:#2e7d9a;
    --white:#ffffff;--star-empty:#d8cdb0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    font-family:'Poppins',Arial,sans-serif;
    background:linear-gradient(160deg,var(--sand) 0%,#eee3c8 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:var(--white);max-width:480px;width:100%;
    border-radius:28px;box-shadow:0 20px 45px rgba(11,60,93,0.18);
    padding:40px 32px 32px;text-align:center;
    position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:-60px;right:-60px;
    width:160px;height:160px;
    background:radial-gradient(circle,var(--gold-light) 0%,transparent 70%);
    opacity:0.5;border-radius:50%;
  }
  .wave{
    position:absolute;bottom:0;left:0;width:100%;height:38px;
    background:var(--sea);opacity:0.08;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .lang-switch{
    display:flex;justify-content:center;gap:8px;
    margin-bottom:22px;position:relative;z-index:2;
  }
  .lang-switch button{
    border:1.5px solid var(--navy);background:transparent;color:var(--navy);
    padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
    cursor:pointer;transition:all .2s;letter-spacing:.5px;font-family:'Poppins',sans-serif;
  }
  .lang-switch button.active,.lang-switch button:hover{background:var(--navy);color:var(--white);}
  .logo{
    width:110px;height:110px;margin:0 auto 18px;
    border-radius:50%;border:3px solid var(--gold);
    object-fit:cover;display:block;background:var(--sand);
  }
  /* Badge camarero (QR individual) */
  .waiter-badge{
    background:rgba(200,155,60,.1);border:1.5px solid var(--gold);border-radius:16px;
    padding:12px 16px;margin:0 0 20px;
    display:flex;align-items:center;gap:12px;
    position:relative;z-index:2;text-align:left;
  }
  .waiter-avatar{
    width:44px;height:44px;border-radius:50%;
    background:var(--navy);color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;flex-shrink:0;
  }
  .badge-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--sea);margin-bottom:2px;}
  .badge-name{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--navy-dark);font-weight:600;}
  /* Selector camarero (QR genèric) */
  .waiter-selector{margin:0 0 20px;position:relative;z-index:2;}
  .sel-label{
    font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
    color:var(--navy);margin-bottom:10px;text-align:center;
  }
  .waiter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .w-chip{
    border:1.5px solid #e2d5b0;border-radius:12px;padding:10px 8px;
    text-align:center;cursor:pointer;font-family:'Poppins',sans-serif;
    font-size:13px;color:#7a8a9e;background:var(--sand);transition:all .18s;
  }
  .w-chip:hover,.w-chip:active{border-color:var(--navy);color:var(--navy);}
  .w-chip.sel{border-color:var(--gold);background:rgba(200,155,60,.12);color:var(--navy-dark);font-weight:600;}
  .w-chip.full{grid-column:1/-1;color:#9aa5ab;font-size:12px;}
  /* Main */
  h1{
    font-family:'Cormorant Garamond','Georgia',serif;color:var(--navy-dark);
    font-size:30px;margin:0 0 6px;letter-spacing:.5px;position:relative;z-index:2;
  }
  p.subtitle{color:#5c6b73;font-size:15px;margin:0 0 16px;line-height:1.5;position:relative;z-index:2;}
  .warn{font-size:12px;color:#c8763c;font-weight:600;margin:-8px 0 12px;position:relative;z-index:2;}
  .stars{display:flex;justify-content:center;gap:10px;margin:10px 0 30px;position:relative;z-index:2;}
  .stars svg{width:44px;height:44px;cursor:pointer;fill:var(--star-empty);transition:transform .15s,fill .15s;}
  .stars svg:hover{transform:scale(1.15);}
  .stars svg.lit{fill:var(--gold);}
  .redirect-msg{font-size:14px;color:var(--sea);font-weight:600;margin-top:6px;position:relative;z-index:2;}
  .footer-note{font-size:12px;color:#9aa5ab;margin-top:8px;position:relative;z-index:2;}
</style>
</head>
<body>
<div class="card">
  <div class="wave"></div>

  <div class="lang-switch">
    <button data-lang="es" onclick="setLang('es')">ES</button>
    <button data-lang="fr" onclick="setLang('fr')">FR</button>
    <button data-lang="en" onclick="setLang('en')">EN</button>
  </div>

  <img class="logo" src="https://lh3.googleusercontent.com/d/1Sn6cRZPGXz9UCWmdOR2Ea6JmohuCCZUl" alt="L'Ancora">

  <!-- Badge individual — hidden by default, shown via JS -->
  <div id="wBadge" style="display:none">
    <div class="waiter-badge">
      <div class="waiter-avatar" id="wInitial">J</div>
      <div>
        <div class="badge-label" id="wLabel">Has sido atendido/a por</div>
        <div class="badge-name" id="wName">Josselin</div>
      </div>
    </div>
  </div>

  <!-- Selector genèric — visible by default, hidden via JS when ?c= detected -->
  <div id="wSelector" class="waiter-selector">
    <div class="sel-label" id="selLabel">¿Quién te ha atendido?</div>
    <div class="waiter-grid">
      <div class="w-chip" onclick="pickWaiter('Sandra',this)">Sandra</div>
      <div class="w-chip" onclick="pickWaiter('Josselin',this)">Josselin</div>
      <div class="w-chip" onclick="pickWaiter('Alberto',this)">Alberto</div>
      <div class="w-chip" onclick="pickWaiter('Anas',this)">Anas</div>
      <div class="w-chip" onclick="pickWaiter('Abdellah',this)">Abdellah</div>
      <div class="w-chip full" id="noChip" onclick="pickWaiter('',this)">No lo recuerdo</div>
    </div>
  </div>

  <h1 id="hTitle">¿Cómo ha sido tu experiencia?</h1>
  <p class="subtitle" id="hSub">Tu opinión nos ayuda a mejorar cada día en L'Àncora.</p>
  <p class="warn" id="wWarn" style="display:none">⚠️ Selecciona primero quién te ha atendido</p>

  <div class="stars" id="stars">
    <svg data-v="1" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
    <svg data-v="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
    <svg data-v="3" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
    <svg data-v="4" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
    <svg data-v="5" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
  </div>

  <div class="redirect-msg" id="rMsg" style="display:none">Gracias, redirigiendo…</div>
  <p class="footer-note" id="fNote">L'Àncora Bar Restaurant · Roses</p>
</div>

<script>
var GOOGLE_URL = "https://g.page/r/CbUHHhOQWx2cEBE/review";
var FORM_URL   = "https://forms.gle/nr3uLNdPd2JcMoRJ7";
var LOG_URL    = "https://script.google.com/macros/s/AKfycbw-HEGd93z5tdMFDt6OjG9OwaK4ls94JwOtobNvLj7C5lvdq4rPAE9vQNzHaDjeXmZgDg/exec";

var T = {
  es:{title:"¿Cómo ha sido tu experiencia?",sub:"Tu opinión nos ayuda a mejorar cada día en L'Àncora.",foot:"L'Àncora Bar Restaurant · Roses",redir:"Gracias, redirigiendo…",sel:"¿Quién te ha atendido?",no:"No lo recuerdo",warn:"⚠️ Selecciona primero quién te ha atendido",by:"Has sido atendido/a por"},
  fr:{title:"Comment s'est passée votre expérience ?",sub:"Votre avis nous aide à nous améliorer chaque jour à L'Àncora.",foot:"L'Àncora Bar Restaurant · Roses",redir:"Merci, redirection en cours…",sel:"Qui vous a servi(e) ?",no:"Je ne m'en souviens pas",warn:"⚠️ Veuillez d'abord sélectionner votre serveur",by:"Servi(e) par"},
  en:{title:"How was your experience?",sub:"Your feedback helps us improve every day at L'Àncora.",foot:"L'Àncora Bar Restaurant · Roses",redir:"Thank you, redirecting…",sel:"Who served you?",no:"I don't remember",warn:"⚠️ Please select who served you first",by:"Served by"}
};

var lang = "es";
var waiter = "";
var generic = true;

// Safe URL param reader (no URLSearchParams for max compatibility)
function getParam(name) {
  var match = window.location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return match ? decodeURIComponent(match[1].replace(/\+/g,' ')) : '';
}

// Init: detect ?c= param
var NAMES = {sandra:"Sandra", josselin:"Josselin", alberto:"Alberto", anas:"Anas", abdellah:"Abdellah"};
var cParam = getParam('c').toLowerCase().trim();

if (cParam && NAMES[cParam]) {
  // QR individual: show badge, hide selector
  generic = false;
  waiter = NAMES[cParam];
  document.getElementById('wBadge').style.display = 'block';
  document.getElementById('wInitial').textContent = NAMES[cParam].charAt(0);
  document.getElementById('wName').textContent = NAMES[cParam];
  document.getElementById('wSelector').style.display = 'none';
} else {
  // QR generic: selector already visible (default), hide badge
  generic = true;
  document.getElementById('wBadge').style.display = 'none';
  document.getElementById('wSelector').style.display = 'block';
}

// Language
function detectLang() {
  var n = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
  if (n.indexOf('fr') === 0) return 'fr';
  if (n.indexOf('en') === 0) return 'en';
  return 'es';
}

function setLang(l) {
  lang = l;
  var t = T[l];
  document.getElementById('hTitle').textContent = t.title;
  document.getElementById('hSub').textContent = t.sub;
  document.getElementById('fNote').textContent = t.foot;
  document.getElementById('rMsg').textContent = t.redir;
  document.getElementById('selLabel').textContent = t.sel;
  document.getElementById('noChip').textContent = t.no;
  document.getElementById('wWarn').textContent = t.warn;
  document.getElementById('wLabel').textContent = t.by;
  var btns = document.querySelectorAll('.lang-switch button');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].getAttribute('data-lang') === l) {
      btns[i].className = 'active';
    } else {
      btns[i].className = '';
    }
  }
}
setLang(detectLang());

// Waiter picker
function pickWaiter(name, btn) {
  waiter = name;
  var chips = document.querySelectorAll('.w-chip');
  for (var i = 0; i < chips.length; i++) chips[i].className = chips[i].className.replace(' sel','');
  btn.className += ' sel';
  document.getElementById('wWarn').style.display = 'none';
}

// Stars
var sc = document.getElementById('stars');
var svgs = sc.querySelectorAll('svg');
var locked = false;

function paint(n) {
  for (var i = 0; i < svgs.length; i++) {
    if (Number(svgs[i].getAttribute('data-v')) <= n) {
      svgs[i].className = 'lit';
    } else {
      svgs[i].className = '';
    }
  }
}

for (var i = 0; i < svgs.length; i++) {
  (function(sv) {
    sv.onmouseover = function() { if (!locked) paint(Number(sv.getAttribute('data-v'))); };
    sv.onmouseout  = function() { if (!locked) paint(0); };
    sv.onclick = function() {
      if (generic && waiter === '') {
        document.getElementById('wWarn').style.display = 'block';
        // Scroll to selector
        document.getElementById('wSelector').scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      if (locked) return;
      locked = true;
      var v = Number(sv.getAttribute('data-v'));
      paint(v);
      document.getElementById('rMsg').style.display = 'block';
      // Log to Google Sheets before redirect
      try {
        new Image().src = LOG_URL
          + '?action=log'
          + '&waiter=' + encodeURIComponent(waiter || 'Desconegut')
          + '&stars=' + v
          + '&lang=' + lang
          + '&_=' + Date.now();
      } catch(ex) {}

      setTimeout(function() {
        window.location.href = (v >= 4) ? GOOGLE_URL : FORM_URL;
      }, 700);
    };
  })(svgs[i]);
}
</script>
</body>
</html>
