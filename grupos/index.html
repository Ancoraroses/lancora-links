<style>
/* Layout: sticky header with the 40th-anniversary seal, sunset-sea hero, three occasion cards, full-bleed navy lead band, benefits grid, closing CTA. Boldness lives in the hero script headline; the rest stays quiet. */
:root{
  --bg:#fbf9f4; --surface:#ffffff; --tint:#f2ece0; --fg:#1c3454; --muted:#51607a; --line:#e4ddcc;
  --band:#1c3454; --band-fg:#f4f8fc; --band-muted:#bccadf;
  --sky:#d3e6f3; --sky-strong:#2f7fb0; --gold:#c8963e;
  --cta:#b5562d; --cta-hover:#9a4622; --cta-fg:#ffffff; --wa:#168a48; --wa-fg:#ffffff;
  --field-bg:#ffffff; --field-fg:#1c3454; --field-line:#c9d3e3;
  --font-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --font-script:"Allura","Snell Roundhand","Brush Script MT",cursive;
  --shadow:0 10px 30px rgba(28,52,84,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1830; --surface:#16223f; --tint:#121d38; --fg:#eef3fa; --muted:#a9b6cc; --line:#27355a;
    --band:#0b1429; --sky:#1c3354; --sky-strong:#7cc0ea; --shadow:0 10px 30px rgba(0,0,0,.35);
    --cta:#c8693f; --cta-hover:#d9794d; --wa:#1faa59; color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky-strong);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.script{font-family:var(--font-script);font-weight:400;letter-spacing:0}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase}

/* header */
.site-header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{width:46px;height:46px;flex:none}
.brand span{font-family:var(--font-script);font-size:2.2rem;line-height:1}
.langs{display:flex;gap:4px}
.langs button{font:600 .78rem var(--font-body);letter-spacing:.06em;color:var(--fg);background:transparent;border:1.5px solid transparent;border-radius:999px;padding:7px 11px;cursor:pointer}
.langs button:hover{border-color:var(--line)}
.langs button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 1rem/1.2 var(--font-body);border:0;border-radius:999px;padding:16px 28px;cursor:pointer;text-decoration:none;text-align:center;transition:background .2s,transform .2s}
.btn-primary{background:var(--cta);color:var(--cta-fg)}
.btn-primary:hover{background:var(--cta-hover);transform:translateY(-1px)}
.btn-wa{background:var(--wa);color:var(--wa-fg)}
.btn-wa:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--band-fg);border:1.5px solid rgba(255,255,255,.6)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;isolation:isolate;
  background:
    radial-gradient(circle at 76% 64%, #ffd9a0 0 5.5%, rgba(255,190,120,.55) 9%, transparent 24%),
    linear-gradient(180deg,#14284f 0%,#2c3f72 34%,#b86a6a 62%,#e9a46c 70%,#274e7a 70.2%,#1b3a63 100%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,16,36,.55),rgba(8,16,36,.25) 45%,rgba(8,16,36,.6))}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;z-index:-1;opacity:.35;background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.18) 14px 16px)}
.hero .wrap{padding-top:64px;padding-bottom:72px}
.hero-inner{max-width:760px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.hero .seal{width:104px;height:104px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
.hero .eyebrow{color:#ffe1b8}
.hero h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:700;letter-spacing:-.01em}
.hero h1 .script{display:block;font-size:1.45em;line-height:1.05;color:#ffe9c9;margin-top:.1em}
.hero .sub{font-size:clamp(1rem,2.2vw,1.2rem);max-width:60ch;color:#eef3fa}
.proof{font-size:.92rem;color:#eef3fa;max-width:52ch}
.proof .stars{display:block;font-size:1.05rem;letter-spacing:.12em;color:#ffd27a;margin-bottom:2px}

/* sections */
.section{padding-block:76px}
.section-head{max-width:640px;display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
.section-head .eyebrow{color:var(--sky-strong)}
.section-head h2{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:700}
.section-head h2 .script{font-size:1.35em;line-height:1}
.alt{background:var(--tint)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:24px}
.card{background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.card-img{aspect-ratio:16/10;max-width:100%}
.img-company{background:linear-gradient(160deg,#d3e6f3,#7fb2d6 60%,#2f5f94)}
.img-birthday{background:linear-gradient(160deg,#f4e3c4,#e8b98a 55%,#c98a58)}
.img-friends{background:linear-gradient(160deg,#e9dcc3,#9fc4de 55%,#3d6ea3)}
.card-body{padding:24px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.25rem;font-weight:700}
.card p{color:var(--muted)}

/* lead band */
.lead{background:var(--band);color:var(--band-fg);padding-block:84px;scroll-margin-top:68px}
.lead-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:48px;align-items:start}
.lead h2{font-size:clamp(1.8rem,4.2vw,2.7rem);font-weight:700}
.lead h2 .script{font-size:1.3em;color:#d3e6f3}
.lead .copy{display:flex;flex-direction:column;gap:18px}
.lead .copy p{color:var(--band-muted);max-width:48ch}
.gift{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:16px;padding:14px 16px;font-size:.95rem}
.form{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:28px;display:grid;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.82rem;font-weight:600;letter-spacing:.02em}
.field label small{font-weight:400;color:var(--band-muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:16px}
input,select{width:100%;font:500 1rem var(--font-body);color:var(--field-fg);background:var(--field-bg);border:1.5px solid var(--field-line);border-radius:12px;padding:13px 14px;min-width:0}
input::placeholder{color:#6d7b94}
input:focus-visible,select:focus-visible{outline:3px solid #8ec9ee;outline-offset:2px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:.85rem;color:var(--band-muted);line-height:1.5}
.consent input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--cta)}
.form .btn{width:100%}
.btn[disabled]{opacity:.65;cursor:progress}
.err{color:#ffc9b3;font-size:.85rem;min-height:1.2em}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.legal{font-size:.75rem;color:var(--band-muted);line-height:1.5}
.done{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px}
.done h3{font-size:1.5rem}
.done p{color:var(--band-muted)}
.done .actions{display:flex;flex-wrap:wrap;gap:12px}

/* benefits */
.benefits{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:28px 40px;list-style:none;margin:0;padding:0}
.benefit{display:flex;gap:16px;align-items:flex-start;min-width:0}
.benefit .ico{flex:none;width:52px;height:52px;border-radius:16px;background:var(--sky);display:grid;place-items:center;font-size:1.5rem}
.benefit .ico img{width:34px;height:34px}
.benefit h3{font-size:1.05rem;font-weight:700;margin-bottom:2px}
.benefit p{color:var(--muted);font-size:.96rem}

/* closing + footer */
.closing .wrap{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.closing h2{font-size:clamp(1.7rem,4vw,2.5rem);max-width:20ch}
.closing h2 .script{font-size:1.3em}
.closing p{color:var(--muted);max-width:52ch}
footer{border-top:1px solid var(--line);padding-block:32px;font-size:.9rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center}
footer .brand img{width:56px;height:56px}
footer address{font-style:normal}
footer .legal{color:var(--muted);flex-basis:100%}

/* floating whatsapp */
.wa-float{position:fixed;z-index:70;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;text-decoration:none}
.wa-tip{background:var(--surface);color:var(--fg);font-size:.85rem;font-weight:600;padding:9px 14px;border-radius:999px;box-shadow:var(--shadow);border:1px solid var(--line)}
.wa-btn{width:60px;height:60px;border-radius:50%;background:var(--wa);color:var(--wa-fg);display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.28);animation:bob 2.6s ease-in-out infinite}
.wa-btn svg{width:30px;height:30px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (max-width:420px){.wa-tip{display:none}.brand span{font-size:1.9rem}.langs button{padding:7px 8px}}
@media (max-width:860px){.lead-grid{grid-template-columns:minmax(0,1fr);gap:32px}.section{padding-block:56px}.lead{padding-block:56px}.hero .wrap{padding-top:40px;padding-bottom:60px}}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.wa-btn{animation:none}.btn{transition:none}}
</style>
</head>

/* ============ Idioma ============ */
var LANGS=['ca','es','fr','en'], lang='es';
function detect(){
  var q=null; try{q=new URLSearchParams(location.search).get('lang');}catch(e){}
  if(q && T[q]) return q;
  try{var s=localStorage.getItem('lancora-grupos-lang'); if(s && T[s]) return s;}catch(e){}
  var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'es'];
  for(var i=0;i<list.length;i++){var c=String(list[i]).slice(0,2).toLowerCase(); if(T[c]) return c;}
  return 'es';
}
function apply(l){
  lang=l; var t=T[l];
  document.documentElement.lang=l; document.title=t.title;
  document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n'); if(t[k]!==undefined) el.innerHTML=t[k];});
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l?'true':'false');});
  document.getElementById('wa-float').setAttribute('aria-label', t.wa_aria);
  document.getElementById('f-email').placeholder = l==='fr'?'vous@email.com':(l==='en'?'you@email.com':'tu@email.com');
  if(!done.hidden && lastState) showDone(lastState);
}

var form=document.getElementById('lead-form'), done=document.getElementById('lead-done'), err=document.getElementById('form-err'),
    submit=document.getElementById('f-submit'), waBtn=document.getElementById('done-wa'), lastState=null, lastLines=[];

function showDone(ok){
  var t=T[lang]; lastState=ok;
  document.getElementById('done-title').textContent = ok? t.done_ok_t : t.done_ko_t;
  document.getElementById('done-text').textContent  = ok? t.done_ok_p : t.done_ko_p;
  var lines=[t.wa_intro];
  var typeLabel=document.querySelector('#f-type option[value="'+v('f-type')+'"]');
  if(v('f-name')) lines.push(t.wa_name+': '+v('f-name'));
  lines.push(t.wa_event+': '+(typeLabel?typeLabel.textContent:v('f-type')));
  if(v('f-date')) lines.push(t.wa_date+': '+v('f-date'));
  if(v('f-guests')) lines.push(t.wa_guests+': '+v('f-guests'));
  lines.push(t.wa_email+': '+v('f-email')); lines.push(t.wa_phone+': '+v('f-phone'));
  waBtn.href='https://wa.me/34972256386?text='+encodeURIComponent(lines.join('\n'));
  form.hidden=true; done.hidden=false;
}
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'));},ms);})]);}

form.addEventListener('submit',function(ev){
  ev.preventDefault(); err.textContent='';
  var t=T[lang], email=v('f-email'), phone=v('f-phone');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=t.e_email; document.getElementById('f-email').focus(); return;}
  if(phone.replace(/[^0-9]/g,'').length<7){err.textContent=t.e_phone; document.getElementById('f-phone').focus(); return;}
  if(v('f-web')){ showDone(true); return; }              // trampa anti-bots: no se guarda nada
  submit.disabled=true; var label=submit.textContent; submit.textContent=t.sending;
  var lead={
    name:v('f-name').slice(0,80), email:email.slice(0,120), phone:phone.slice(0,30),
    type:v('f-type'), date:v('f-date'), guests:v('f-guests')?parseInt(v('f-guests'),10):null,
    consent:document.getElementById('f-consent').checked, lang:lang, source:'grupos',
    ts:firebase.firestore.FieldValue.serverTimestamp()
  };
  if(lead.guests===null) delete lead.guests;
  var job = fdb ? withTimeout(fdb.collection(LEADS_COLLECTION).add(lead),9000) : Promise.reject(new Error('no-db'));
  job.then(function(){ showDone(true); })
     .catch(function(){ showDone(false); })
     .then(function(){ submit.disabled=false; submit.textContent=T[lang].l_submit; });
});
